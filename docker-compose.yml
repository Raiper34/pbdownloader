services:
  redis:
    image: redis:7-alpine
    container_name: pdownloader-redis
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pdownloader-backend
    environment:
      PORT: 3000
      DB_PATH: /app/data/pdownloader.db
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - backend_data:/app/data
      - downloads:/app/downloads
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pdownloader-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
  backend_data:
  downloads:
